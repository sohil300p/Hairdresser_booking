services:
  mysql:
    image: mysql:8.0
    container_name: barber-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: barber_booking
      MYSQL_USER: barberuser
      MYSQL_PASSWORD: barberpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
