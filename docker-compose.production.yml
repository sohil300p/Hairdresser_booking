version: "3.9"

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-barber_booking}
      MYSQL_USER: ${MYSQL_USER:-barberuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-barberpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-mysql://barberuser:barberpass@mysql:3306/barber_booking}
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.backend.rule: Host(`api.example.com`)
    #   traefik.http.services.backend.loadbalancer.server.port: "3000"

  frontend:
    build:
      context: .
      dockerfile: src-front/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:3000/api}
        VITE_MAPIR_API_KEY: ${VITE_MAPIR_API_KEY:-}
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.frontend.rule: Host(`app.example.com`)
    #   traefik.http.services.frontend.loadbalancer.server.port: "80"

volumes:
  mysql-data:
