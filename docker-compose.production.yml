version: "3.9"

# Shared Dokploy network: barberApp_service joins so backend can reach barberApp_infra (Redis, MariaDB, MinIO).
networks:
  default:
    name: dokploy-network
    external: true

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    entrypoint: ["/app/entrypoint.sh"]
    # No depends_on on infra; MySQL/Redis/MinIO are on shared infrastructure

  frontend-user:
    build:
      context: .
      dockerfile: docker/frontend-user/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:3000/api}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started

  frontend-barber:
    build:
      context: .
      dockerfile: docker/frontend-barber/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:3000/api}
        VITE_MAPIR_API_KEY: ${VITE_MAPIR_API_KEY:-}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started

  frontend-admin:
    build:
      context: .
      dockerfile: docker/frontend-admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:3000/api}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started

  frontend-fastpath:
    build:
      context: .
      dockerfile: docker/frontend-fastpath/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:3000/api}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
